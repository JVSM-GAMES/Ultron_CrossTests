name: Ultron Core Matrix CI

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux
            bin: ultron
          - os: macos-14
            target: aarch64-macos
            bin: ultron
          - os: windows-latest
            target: x86_64-windows
            bin: ultron.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: "Baixando Binários e Testes"
      uses: actions/checkout@v4

    - name: "🛠️ Instalando a Toolchain C11 (Zig Compiler)"
      uses: mlugg/setup-zig@v1
      with:
        version: 0.13.0

    - name: "🌍 Pre-configurando Ambiente (Idioma Pt-Br)"
      shell: bash
      run: |
        mkdir -p .Ultron
        echo "Pt-Br" > .Ultron/lang.txt

    - name: "[Linux/macOS] Configurar Permissões e Instalar Global"
      if: runner.os != 'Windows'
      run: |
        chmod +x zig-out/${{ matrix.target }}/${{ matrix.bin }}
        sudo ./zig-out/${{ matrix.target }}/${{ matrix.bin }} instalar
        echo "✅ Ultron instalado em /usr/local/bin"

    - name: "[Windows] Configurar PATH Global"
      if: runner.os == 'Windows'
      run: |
        echo "${{ github.workspace }}\zig-out\${{ matrix.target }}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "✅ PATH configurado para o Windows"

    - name: "⚙️ Teste 1 - Verificação do Binário e Versão"
      run: ultron versao

    - name: "🚀 Teste 2 - Suíte Master de Módulos (Main Runner)"
      run: ultron executar tests/main.ult

    - name: "🛸 Teste 3 - A Prova Real do APE (Rodando o mesmo Binário)"
      shell: bash
      run: |
        cd tests
        echo "=================================================="
        echo "🛸 PROVA APE COSMOPOLITAN"
        echo "Executando o mesmo arquivo APE compilado localmente..."
        echo "OS Atual: $RUNNER_OS"
        
        chmod +x hello_world.ultron.com || true

        if [ "$RUNNER_OS" == "macOS" ]; then
          # Apple Silicon/Macs precisam do bypass de binfmt shell script via 'sh'
          sh ./hello_world.ultron.com
        elif [ "$RUNNER_OS" == "Windows" ]; then
          # Renomear para .exe força o Windows PE Loader a absorver o formato mutante
          mv hello_world.ultron.com hello_world.exe
          ./hello_world.exe
        else
          # Linux roda nativamente como ELF via Kernel
          ./hello_world.ultron.com
        fi
        
        echo "✅ Arquivo universal validado com sucesso!"
        echo "=================================================="

    - name: "🧹 [Linux/macOS] Desinstalação Limpa"
      if: runner.os != 'Windows'
      run: sudo ultron desinstalar
